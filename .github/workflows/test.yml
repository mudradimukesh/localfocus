name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust core/server tests
        run: cargo test

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter analyze (companion)
        working-directory: mobile/local_focus_mobile
        run: flutter analyze lib

      - name: Flutter tests (companion)
        working-directory: mobile/local_focus_mobile
        run: flutter test
